<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="cantainer">
        <div class="logo-cart">
            <img src="" alt="">
            <i class="fa-solid fa-bag-shopping"></i>
        </div>
        <div class="main-image">
            <img src="blue active" alt="">
            <img src="pink" alt="">
            <img src="yellow" alt="">
        </div>
        <div class="info">
            <span class="name">ADIDAS GAZE ZX</span>
            <p>these aidas trainers are proof that running-inspired shoes</p>
            <div class="strars">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-regular fa-star"></i>
            </div>
        </div>
        <div class="color-price">
            <div class="color-option">
                <span class="color">Colour</span>
                <div class="circles">
                    <span class="circle blue active" data-option="blue" style="--color:#0071c7;"></span>
                    <span class="circles pink" data-option="pink" style="--color:#fa1795"></span>
                    <span class="circles yellow" data-option="yellow" style="--color:#f5da00"></span>
                </div>
            </div>
            <div class="price">
                <span class="price_num">$89.00</span>
                <span class="price_letter">Nine dollar only</span>
            </div>
        </div>
        <div class="add-cart button">
            <div class="button-layer"></div>
            <button>Add To Cart</button>
        </div>
    </div>
</body>
</html>
